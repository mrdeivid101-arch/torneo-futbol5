<style>
  /* --- Estilos para el calendario desplegable --- */
details.cal-vuelta-details {
  margin-bottom: 2rem;
}

/* Ocultar el marcador nativo feo de Chrome/Safari */
details.cal-vuelta-details summary.cal-vuelta::-webkit-details-marker {
  display: none;
}

details.cal-vuelta-details summary.cal-vuelta {
  cursor: pointer;
  list-style: none; /* Oculta la flecha por defecto */
  display: flex;
  justify-content: space-between; /* Manda la flecha nueva a la derecha */
  align-items: center;
  user-select: none;
}

/* Flecha personalizada a la derecha del título */
details.cal-vuelta-details summary.cal-vuelta::after {
  content: "▼";
  font-size: 0.9rem;
  color: var(--text-muted, rgba(255, 255, 255, 0.6));
  transition: transform 0.2s ease;
}

/* Girar la flecha cuando el panel está abierto */
details.cal-vuelta-details[open] summary.cal-vuelta::after {
  content: "▲";
}

/* Animación suave para el contenido al abrir */
.cal-vuelta-content {
  padding-top: 10px;
  animation: fadeInDown 0.3s ease-out;
}

@keyframes fadeInDown {
  from {
    opacity: 0;
    transform: translateY(-8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
  :root {
    --pitch-dark: #0B2545;
    --pitch: #1D5BA6;
    --grass: #5EC8FA;
    --chalk: #F4F7FB;
    --card: #FFFFFF;
    --ink: #0F2036;
    --ink-soft: #55677E;
    --gold: #D9A441;
    --line: rgba(15, 32, 54, 0.10);
    --font-display: 'Teko', sans-serif;
    --font-body: 'Inter', sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --chalk: #0A1626;
      --card: #10203A;
      --ink: #EDF2FA;
      --ink-soft: #9FB0C8;
      --line: rgba(237, 242, 250, 0.10);
    }
  }
  :root[data-theme="dark"] {
    --chalk: #0A1626;
    --card: #10203A;
    --ink: #EDF2FA;
    --ink-soft: #9FB0C8;
    --line: rgba(237, 242, 250, 0.10);
  }

  body {

    background: var(--chalk);
    color: var(--ink);
    font-family: var(--font-body);

  .hero::after {

    left: 50%;

    height: 1px;
    background: rgba(244, 247, 251, 0.16);
    transform: translateX(-50%);

  .hero-inner {
    max-width: 640px;
    margin: 0 auto;
    position: relative;
    text-align: center;
  }

  .badge {

    height: 60px;
    margin: 0 auto 0.9rem;

  .connect-out::after {
    content: '';
    position: absolute;
    top: 25%;
    bottom: 25%;
    right: -1rem;
    width: 1rem;
    border-top: 2px solid var(--line);
    border-right: 2px solid var(--line);
    border-bottom: 2px solid var(--line);
    border-radius: 0 7px 7px 0;
  }

  .connect-straight::after {
    content: '';
    position: absolute;
    top: 50%;
    right: -1rem;
    width: 1rem;
    height: 2px;
    background: var(--line);
  }

  .connect-in::before {
    content: '';
    position: absolute;
    top: 50%;
    left: -1rem;
    width: 1rem;
    height: 2px;
    background: var(--line);

  .pts {

  :root[data-theme="dark"] .retry { color: var(--grass); border-color: var(--grass); }

  }
  :root[data-theme="dark"] .cal-vuelta { color: var(--grass); }

  }
  :root[data-theme="dark"] .cal-match-time { color: var(--grass); }

    white-space: nowrap;

    background: var(--card);
    color: var(--ink);
    width: 100%;
    max-width: 420px;
    border-radius: 16px 16px 0 0;
    padding: 1.4rem 1.3rem 1.6rem;
    max-height: 85vh;
    overflow-y: auto;
    border-top: 3px solid var(--pitch);
  }

  @media (min-width: 480px) {
    .team-modal { border-radius: 16px; }
  }

  .team-modal-head {
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }

  .team-modal-head .b-crest { width: 2.6rem; height: 2.6rem; font-size: 1.2rem; }

  .team-modal-name {
    font-family: var(--font-display);
    font-size: 1.5rem;
    font-weight: 600;
    line-height: 1;
  }

  .team-modal-pos { font-size: 0.8rem; color: var(--ink-soft); margin-top: 0.2rem; }

  .team-modal-close {
    margin-left: auto;
    background: var(--line);
    border: none;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    font-size: 1rem;
    color: var(--ink);
    cursor: pointer;
    flex: none;
  }

  .team-modal-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.5rem;
    margin: 1.1rem 0;
  }

  .team-modal-stat {
    background: var(--chalk);
    border-radius: 10px;
    padding: 0.55rem 0.3rem;
    text-align: center;
  }

  .team-modal-stat .v {
    font-family: var(--font-display);
    font-size: 1.25rem;
    font-weight: 600;
    display: block;
  }

  .team-modal-stat .l {
    font-size: 0.66rem;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .team-modal-section { margin-top: 1.1rem; }

  .team-modal-label {
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin: 0 0 0.4rem;
  }

  .team-modal-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 0.92rem;
  }

  .team-modal-row .b-crest { width: 1.5rem; height: 1.5rem; font-size: 0.7rem; }

  .team-modal-scorer-goals {
    margin-left: auto;
    font-family: var(--font-display);
    font-size: 1.1rem;
    font-weight: 600;
  }

  #confettiCanvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 60;
  }

  @media (max-width: 380px) {
    thead th, tbody td { padding: 0.6rem 0.4rem; font-size: 0.88rem; }
    .tab { font-size: 0.72rem; padding: 0.6rem 0.2rem; }
  }

  /* --- Filtro de Equipo --- */
.cal-filter-container {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
  margin-bottom: 1.5rem;
}

.cal-select {
  background: #1e293b;
  color: #fff;
  border: 1px solid #334155;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 0.9rem;
  outline: none;
  cursor: pointer;
}

.cal-select:focus {
  border-color: #38bdf8;
}

.highlight-team .cal-name {
  color: #38bdf8;
  font-weight: bold;
}

/* --- Encuesta de Predicción --- */
.poll-container {
  margin-top: 1rem;
  background: rgba(15, 23, 42, 0.6);
  border: 1px solid #334155;
  border-radius: 10px;
  padding: 12px;
  text-align: center;
}

.poll-title {
  font-size: 0.85rem;
  color: #94a3b8;
  margin-bottom: 10px;
}

.poll-buttons {
  display: flex;
  gap: 8px;
  justify-content: center;
}

.poll-btn {
  background: #1e293b;
  border: 1px solid #38bdf8;
  color: #38bdf8;
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.8rem;
  transition: all 0.2s;
}

.poll-btn:hover {
  background: #38bdf8;
  color: #0f172a;
}

.poll-bar-wrapper {
  margin-bottom: 6px;
  text-align: left;
}

.poll-label {
  font-size: 0.75rem;
  color: #cbd5e1;
  display: block;
  margin-bottom: 2px;
}

.poll-bar {
  background: #334155;
  height: 8px;
  border-radius: 4px;
  overflow: hidden;
}

 .poll-fill {
  background: #38bdf8;
  height: 100%;
  border-radius: 4px;
  transition: width 0.4s ease;
}

/* --- Encuestas de toda la jornada, desplegables --- */
.jornada-polls {
  margin-top: 1rem;
  background: rgba(15, 23, 42, 0.6);
  border: 1px solid #334155;
  border-radius: 10px;
  overflow: hidden;
  text-align: left;
}
.jornada-polls-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 12px;
  background: rgba(30, 41, 59, 0.55);
}
.jornada-polls-title {
  margin: 0;
  font-size: 0.82rem;
  font-weight: 700;
  color: #cbd5e1;
}
.jornada-polls-toggle {
  border: 1px solid #475569;
  background: transparent;
  color: #cbd5e1;
  border-radius: 6px;
  padding: 5px 9px;
  cursor: pointer;
  font-size: 0.72rem;
}
.jornada-polls-list {
  display: flex;
  flex-direction: column;
}
.jornada-polls-list.is-minimized {
  display: none;
}
.poll-match-item {
  border-top: 1px solid #334155;
}
.poll-match-item:first-child { border-top: none; }
.poll-match-toggle {
  width: 100%;
  min-height: 44px;
  border: none;
  background: transparent;
  color: #e2e8f0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 9px 12px;
  cursor: pointer;
  text-align: left;
  font-size: 0.78rem;
}
.poll-match-toggle:hover { background: rgba(51, 65, 85, 0.35); }
.poll-match-item.open .poll-match-toggle { background: rgba(30, 41, 59, 0.55); }
.poll-match-teams {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.poll-match-arrow { flex: none; color: #94a3b8; }
.poll-match-content { display: none; padding: 0 10px 10px; }
.poll-match-item.open .poll-match-content { display: block; }
.poll-match-content .poll-container { margin-top: 0; }

/* MVP elegido manualmente: se muestra fuera de Goleadores */
.mvp-hero {
  margin: 0.85rem auto 0;
  max-width: 360px;
}
.mvp-hero .mvp-card { margin-bottom: 0; }

@media (max-width: 380px) {
  .poll-match-toggle { padding-left: 9px; padding-right: 9px; }
  .jornada-polls-head { align-items: flex-start; }
}

/* --- Tarjeta MVP --- */
.mvp-card {
  background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
  border: 1px solid #6366f1;
  border-radius: 12px;
  padding: 14px;
  position: relative;
  margin-bottom: 1.5rem;
  box-shadow: 0 4px 15px rgba(99, 102, 241, 0.2);
}

.mvp-badge {
  font-size: 0.7rem;
  font-weight: bold;
  color: #a5b4fc;
  letter-spacing: 1px;
  margin-bottom: 8px;
}

.mvp-content {
  display: flex;
  align-items: center;
  gap: 12px;
}

.mvp-avatar img {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  border: 2px solid #6366f1;
  object-fit: cover;
}

.mvp-name {
  color: #fff;
  font-size: 1rem;
  margin: 0;
}

.mvp-team {
  font-size: 0.8rem;
  color: #94a3b8;
  margin: 2px 0;
  display: flex;
  align-items: center;
  gap: 4px;
}

.mvp-stat {
  display: inline-block;
  background: #312e81;
  color: #c7d2fe;
  font-size: 0.75rem;
  padding: 2px 8px;
  border-radius: 4px;
  margin-top: 4px;
}
</style>
</head>

<script>
(function () {
  const SUPA_URL = "https://vhipsbojmocoiydcrlyw.supabase.co";
  const SUPA_KEY = "sb_publishable_XSuu3pQmiZbSYTBbVCmhjg_5-4V8FF9";
  const REFRESH_MS = 60000;
  let goleadoresExpanded = false;
  let posQuery = '';
  let golQuery = '';
  let lastPartidos = [];
  let previousChampion = null;
  let lastGoleadoresData = [];
  let lastMvpRows = [];
  let lastEncuestasVotos = [];
  let encuestaVotanteId = null;

  // ================================================================
  // MVP / JUGADOR DE LA JORNADA
  // Se elige desde Supabase, en la tabla MVP_Jornadas.
  // Columnas esperadas: jornada, jugador, equipo, goles, foto_url
  // ================================================================

  const TEAM_LOGOS = {};
  let LIVE_LOGOS = {};
  let TEAM_RANK = {};

  function teamHue(name) {
    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
    return `hsl(${hash % 360}, 42%, 40%)`;
  }

  function crestHtml(teamName) {
    if (!teamName) {
      return `<span class="b-crest" style="background:var(--ink-soft)">–</span>`;
    }
    const safeTeam = escapeHtml(teamName);
    const logo = LIVE_LOGOS[teamName] || TEAM_LOGOS[teamName];
    if (logo) {
      return `<span class="b-crest team-crest" role="button" tabindex="0" data-team="${safeTeam}" title="Ver perfil de ${safeTeam}"><img src="${logo}" alt="Escudo de ${safeTeam}"></span>`;
    }
    const initial = escapeHtml(teamName.trim().charAt(0).toUpperCase() || '?');
    return `<span class="b-crest team-crest" role="button" tabindex="0" data-team="${safeTeam}" title="Ver perfil de ${safeTeam}" style="background:${teamHue(teamName)}">${initial}</span>`;
  }

  function byeSlot(seed, team) {
    return `<div class="b-slot${team ? '' : ' b-pending'}">
      <div class="b-side">
        <span class="b-seed">${escapeHtml(seed)}</span>
        ${crestHtml(team)}
        <span class="b-team">${escapeHtml(team || 'Por definir')}</span>
      </div>
    </div>`;
  }

  function versusSlot(seedA, teamA, seedB, teamB, extraClass, score) {
    const cls = 'b-slot' + (extraClass ? ' ' + extraClass : '');
    const mid = score ? `<div class="b-vs-score">${score.a} - ${score.b}</div>` : `<div class="b-vs">vs</div>`;
    return `<div class="${cls}">
      <div class="b-side${teamA ? '' : ' b-pending'}">
        <span class="b-seed">${escapeHtml(seedA)}</span>
        ${crestHtml(teamA)}
        <span class="b-team">${escapeHtml(teamA || 'Por definir')}</span>
      </div>
      ${mid}
      <div class="b-side${teamB ? '' : ' b-pending'}">
        <span class="b-seed">${escapeHtml(seedB)}</span>
        ${crestHtml(teamB)}
        <span class="b-team">${escapeHtml(teamB || 'Por definir')}</span>
      </div>
    </div>`;
  }

  function renderLlaves(rows, playoffs) {
    if (!rows.length) {
      panelLlaves.innerHTML = stateHtml('Todavía no hay equipos', 'Las llaves aparecen en cuanto haya tabla de posiciones.', false);
      return;
    }
    const sorted = [...rows].sort((a, b) =>
      (b.puntos - a.puntos) || (b.dg - a.dg) || (b.gf - a.gf)
    );
    const t = i => (sorted[i] ? sorted[i].equipo : null);
    const po = Object.fromEntries((playoffs || []).map(p => [p.id, p]));

    function winner(match, teamA, teamB) {
      if (!match || !match.jugado || match.goles_a == null || match.goles_b == null) return null;
      if (match.goles_a === match.goles_b) return null;
      return match.goles_a > match.goles_b ? teamA : teamB;
    }
    const score = m => (m && m.jugado && m.goles_a != null && m.goles_b != null) ? { a: m.goles_a, b: m.goles_b } : null;

    const rep45 = po['REP_45'], rep36 = po['REP_36'], sf1 = po['SF1'], sf2 = po['SF2'], final = po['FINAL'];
    const win45 = winner(rep45, t(3), t(4));
    const win36 = winner(rep36, t(2), t(5));
    const winSF1 = winner(sf1, t(0), win45);
    const winSF2 = winner(sf2, t(1), win36);
    const champion = winner(final, winSF1, winSF2);

    panelLlaves.innerHTML = `
      <p class="bracket-hint">Desliza para ver todas las rondas →</p>
      <div class="bracket-scroll">
        <div class="bracket">

          <div class="b-round round1">
            <span class="b-round-label">Repechaje</span>
            <div class="b-pair connect-out">
              ${byeSlot('1°', t(0))}
              ${versusSlot('4°', t(3), '5°', t(4), '', score(rep45))}
            </div>
            <div class="b-pair connect-out">
              ${byeSlot('2°', t(1))}
              ${versusSlot('3°', t(2), '6°', t(5), '', score(rep36))}
            </div>
          </div>

          <div class="b-round round2 connect-out">
            <span class="b-round-label">Semifinales</span>
            ${versusSlot('1°', t(0), 'G 4-5', win45, 'connect-in', score(sf1))}
            ${versusSlot('2°', t(1), 'G 3-6', win36, 'connect-in', score(sf2))}
          </div>

          <div class="b-round round3 connect-straight">
            <span class="b-round-label">Final</span>
            ${versusSlot('G SF1', winSF1, 'G SF2', winSF2, 'connect-in', score(final))}
          </div>

          <div class="b-round round4">
            <span class="b-round-label">Campeón</span>
            <div class="b-slot b-champion connect-in">
              <span class="trophy" aria-hidden="true">🏆</span>
              <span class="b-team">${champion ? escapeHtml(champion) : 'Por definir'}</span>
            </div>
          </div>

        </div>
      </div>`;

  const prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function animateCountUp(container) {
    container.querySelectorAll('.countup').forEach(el => {
      const target = parseInt(el.getAttribute('data-count'), 10);
      if (isNaN(target)) return;
      const prefix = el.getAttribute('data-prefix') || '';
      const paint = v => { el.textContent = (v > 0 ? prefix : '') + v; };
      if (prefersReducedMotion) { paint(target); return; }
      const duration = 650;
      const start = performance.now();
      function tick(now) {
        const progress = Math.min((now - start) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        paint(Math.round(target * eased));
        if (progress < 1) requestAnimationFrame(tick);
        else paint(target);
      }
      requestAnimationFrame(tick);
    });
  }

  function rachaHtml(teamName) {
    if (!lastPartidos.length) return '';
    const played = lastPartidos.filter(m => m.jugado && (m.equipo_local === teamName || m.equipo_visitante === teamName));
    if (!played.length) return '';
    const last5 = played.slice(-5);
    const dots = last5.map(m => {
      const isLocal = m.equipo_local === teamName;
      const gf = isLocal ? m.goles_local : m.goles_visitante;
      const gc = isLocal ? m.goles_visitante : m.goles_local;
      const rival = isLocal ? m.equipo_visitante : m.equipo_local;
      let cls = 'draw', label = 'Empató';
      if (gf > gc) { cls = 'win'; label = 'Ganó'; }
      else if (gf < gc) { cls = 'loss'; label = 'Perdió'; }
      return `<span class="racha-dot ${cls}" title="${escapeHtml(label)} vs ${escapeHtml(rival)} (${gf}-${gc})"></span>`;
    }).join('');
    return `<span class="racha">${dots}</span>`;
  }

  function nextMatchFor(teamName) {
    return lastPartidos.find(m => !m.jugado && (m.equipo_local === teamName || m.equipo_visitante === teamName)) || null;

  function fireConfetti() {
    if (prefersReducedMotion) return;
    const canvas = document.createElement('canvas');
    canvas.id = 'confettiCanvas';
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    document.body.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    const colors = ['#2D6A4F', '#74C69D', '#D9A441', '#F6F4EC'];
    const pieces = Array.from({ length: 140 }, () => ({
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * canvas.height * 0.4,
      r: 4 + Math.random() * 5,
      c: colors[Math.floor(Math.random() * colors.length)],
      vy: 2 + Math.random() * 3,
      vx: -1.5 + Math.random() * 3,
      rot: Math.random() * Math.PI,
      vr: -0.15 + Math.random() * 0.3
    }));
    const start = performance.now();
    function tick(now) {
      const elapsed = now - start;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pieces.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.c;
        ctx.globalAlpha = Math.max(0, 1 - elapsed / 4200);
        ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 0.6);
        ctx.restore();
      });
      if (elapsed < 4200) requestAnimationFrame(tick);
      else canvas.remove();
    }
    requestAnimationFrame(tick);
  }

  async function shareTable(btn) {
    if (!window.html2canvas) {
      alert('No se pudo generar la imagen. Revisa tu conexión e intenta de nuevo.');
      return;
    }
    const table = panelPos.querySelector('table');
    if (!table) return;
    const originalLabel = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Generando…';
    try {
      const scale = Math.min(window.devicePixelRatio || 2, 3);
      const cardBg = getComputedStyle(document.body).getPropertyValue('--card').trim() || '#ffffff';
      const tableCanvas = await html2canvas(table, {
        backgroundColor: cardBg,
        scale,
        useCORS: true,
        onclone: (clonedDoc, clonedEl) => {
          clonedEl.querySelectorAll('tr').forEach(tr => {
            tr.style.animation = 'none';
            tr.style.opacity = '1';
            tr.style.transform = 'none';
          });
        }
      });

      const headerH = Math.round(96 * scale);
      const final = document.createElement('canvas');
      final.width = tableCanvas.width;
      final.height = headerH + tableCanvas.height;
      const ctx = final.getContext('2d');

      ctx.fillStyle = '#0B2545';
      ctx.fillRect(0, 0, final.width, headerH);
      ctx.fillStyle = '#F4F7FB';
      ctx.font = `600 ${Math.round(30 * scale)}px Teko, sans-serif`;
      ctx.textBaseline = 'alphabetic';
      ctx.fillText('Torneo de Fútbol 5', 24 * scale, 42 * scale);
      ctx.fillStyle = '#5EC8FA';
      ctx.font = `600 ${Math.round(15 * scale)}px Inter, sans-serif`;
      const now = new Date().toLocaleDateString('es-HN', { day: 'numeric', month: 'long' });
      ctx.fillText(`Posiciones · Actualizado el ${now}`, 24 * scale, 68 * scale);

      ctx.drawImage(tableCanvas, 0, headerH);

      final.toBlob(async blob => {
        if (!blob) { throw new Error('No se pudo crear la imagen'); }
        const file = new File([blob], 'posiciones-torneo.png', { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file], title: 'Posiciones · Torneo de Fútbol 5' });
          } catch (e) { }
        } else {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = 'posiciones-torneo.png';
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 5000);
        }
        btn.disabled = false;
        btn.textContent = originalLabel;
      }, 'image/png');
    } catch (e) {
      alert('No se pudo generar la imagen. Intenta de nuevo.');
      btn.disabled = false;
      btn.textContent = originalLabel;
    }
  }

  // --- NUEVA LÓGICA DE FECHAS/HORAS 100% DINÁMICA ---
  function matchScheduleInfo(m) {
  let dateObj = null;
  let displayHora = 'Hora por confirmar';

  if (m.fecha && m.hora) {
    let hrs = 0, mins = 0;
    let horaValida = false;

    // Si viene en formato ISO de Excel (1899-12-30T...)
    if (typeof m.hora === 'string' && m.hora.includes('T')) {
      const d = new Date(m.hora);
      if (!isNaN(d.getTime())) {
        hrs = d.getHours();
        mins = d.getMinutes();
        horaValida = true;
      }
    } else if (typeof m.hora === 'string') {
      // Si viene en formato normal "18:00" o "18:00:00"
      const parts = m.hora.split(':');
      if (parts.length >= 2) {
        hrs = parseInt(parts[0], 10);
        mins = parseInt(parts[1], 10);
        horaValida = true;
      }
    }

    if (horaValida) {
      const ampm = hrs >= 12 ? 'PM' : 'AM';
      const displayHrs = hrs % 12 || 12;
      const displayMins = mins < 10 ? '0' + mins : mins;
      displayHora = `${displayHrs}:${displayMins} ${ampm}`;

      // Reconstruimos la fecha real del partido con la hora corregida
      const [year, month, day] = m.fecha.split('-').map(Number);
      dateObj = new Date(year, month - 1, day, hrs, mins, 0);
    }
  }

  return { displayHora, date: dateObj };
}

  function formatMatchDate(info) {
    if (!info.dateStr) return '';
    const d = new Date(`${info.dateStr}T12:00:00-06:00`);
    if (Number.isNaN(d.getTime())) return '';
    return d.toLocaleDateString('es-HN', { weekday:'long', day:'numeric', month:'long', timeZone:'America/Tegucigalpa' });
  }

  function formatCountdown(ms) {
    if (ms <= 0) return 'El partido comienza ahora';
    const total = Math.floor(ms / 1000);
    const days = Math.floor(total / 86400);
    const hours = Math.floor((total % 86400) / 3600);
    const mins = Math.floor((total % 3600) / 60);
    const secs = total % 60;
    if (days > 0) return `${days}d ${String(hours).padStart(2,'0')}h ${String(mins).padStart(2,'0')}m`;
    return `${String(hours).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
  }

  let nextMatchCountdownTimer = null;

  function startNextMatchCountdown(next) {
    if (nextMatchCountdownTimer) clearInterval(nextMatchCountdownTimer);
    const el = document.getElementById('nextMatchCountdown');
    const info = matchScheduleInfo(next);
    if (!el || !info.date) return;
    const paint = () => {
      const diff = info.date.getTime() - Date.now();
      el.textContent = formatCountdown(diff);
      if (diff <= 0) el.classList.add('live');
    };
    paint();
    nextMatchCountdownTimer = setInterval(paint, 1000);
  }

  // --- ENCUESTAS DE PREDICCIÓN POR JORNADA ---
  function getEncuestaVotanteId() {
    const key = 'torneo_f5_encuesta_votante_id';
    let id = localStorage.getItem(key);
    if (!id) {
      if (window.crypto && crypto.randomUUID) id = crypto.randomUUID();
      else id = 'v-' + Date.now() + '-' + Math.random().toString(36).slice(2);
      localStorage.setItem(key, id);
    }
    encuestaVotanteId = id;
    return id;
  }

  function getPollVotes(matchId) {
    const rows = (lastEncuestasVotos || []).filter(v => String(v.id_partido) === String(matchId));
    const votes = { local: 0, empate: 0, visitante: 0 };
    rows.forEach(v => {
      if (Object.prototype.hasOwnProperty.call(votes, v.opcion)) votes[v.opcion]++;
    });
    return votes;
  }

  function hasVoted(matchId) {
    const voterId = getEncuestaVotanteId();
    return (lastEncuestasVotos || []).some(v =>
      String(v.id_partido) === String(matchId) && String(v.votante_id) === String(voterId)
    );
  }

  async function refreshEncuestas() {
    try {
      lastEncuestasVotos = await fetchTable('Encuestas_Votos');
    } catch (e) {
      console.warn('Encuestas_Votos todavía no está disponible:', e);
      lastEncuestasVotos = [];
    }
  }

  async function submitVote(matchId, option) {
    if (!['local', 'empate', 'visitante'].includes(option)) return;
    if (hasVoted(matchId)) return;

    const voterId = getEncuestaVotanteId();
    const buttons = document.querySelectorAll(`[data-vote-match="${CSS.escape(String(matchId))}"]`);
    buttons.forEach(btn => { btn.disabled = true; });

    try {
      const res = await fetch(`${SUPA_URL}/rest/v1/rpc/registrar_encuesta_voto`, {
        method: 'POST',
        headers: {
          apikey: SUPA_KEY,
          Authorization: `Bearer ${SUPA_KEY}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          p_id_partido: String(matchId),
          p_opcion: option,
          p_votante_id: voterId
        })
      });

      const data = await res.json().catch(() => null);

      if (!res.ok) {
        console.error('No se pudo registrar el voto:', data);
        alert('No se pudo registrar tu voto. Intenta de nuevo.');
        return;
      }

      if (!data || data.ok !== true) {
        const messages = {
          ya_voto: 'Ya registraste tu voto para este partido.',
          demasiados_votos: 'Has realizado demasiados votos en poco tiempo. Intenta nuevamente más tarde.',
          encuesta_cerrada: 'Esta encuesta ya está cerrada porque el partido comenzó o terminó.',
          opcion_invalida: 'La opción seleccionada no es válida.'
        };
        if (data?.reason !== 'ya_voto') {
          alert(messages[data?.reason] || 'No se pudo registrar tu voto.');
        }
      }

      await refreshEncuestas();
      await renderNextMatch();
    } catch (err) {
      console.error('Error de red al votar:', err);
      alert('No se pudo conectar con la encuesta. Intenta de nuevo.');
    } finally {
      buttons.forEach(btn => { btn.disabled = false; });
    }
  }
  window.submitVote = submitVote;

  async function renderPoll(matchId, localName, visitanteName) {
    const voted = hasVoted(matchId);
    const votes = getPollVotes(matchId);
    const totalVotes = votes.local + votes.empate + votes.visitante;
    const calcPct = val => totalVotes > 0 ? Math.round((val / totalVotes) * 100) : 0;

    if (voted) {
      return `
        <div class="poll-container">
          <p class="poll-title">📊 Pronóstico de la afición · ${totalVotes} voto${totalVotes === 1 ? '' : 's'}</p>
          <div class="poll-results">
            <div class="poll-bar-wrapper">
              <span class="poll-label">${escapeHtml(localName)} (${calcPct(votes.local)}%) · ${votes.local}</span>
              <div class="poll-bar"><div class="poll-fill" style="width: ${calcPct(votes.local)}%"></div></div>
            </div>
            <div class="poll-bar-wrapper">
              <span class="poll-label">Empate (${calcPct(votes.empate)}%) · ${votes.empate}</span>
              <div class="poll-bar"><div class="poll-fill" style="width: ${calcPct(votes.empate)}%"></div></div>
            </div>
            <div class="poll-bar-wrapper">
              <span class="poll-label">${escapeHtml(visitanteName)} (${calcPct(votes.visitante)}%) · ${votes.visitante}</span>
              <div class="poll-bar"><div class="poll-fill" style="width: ${calcPct(votes.visitante)}%"></div></div>
            </div>
          </div>
        </div>`;
    }

    return `
      <div class="poll-container">
        <p class="poll-title">🔮 ¿Quién ganará este encuentro? · ${totalVotes} voto${totalVotes === 1 ? '' : 's'}</p>
        <div class="poll-buttons">
          <button class="poll-btn" type="button" data-vote-match="${escapeHtml(matchId)}" data-vote-option="local">${escapeHtml(localName)}</button>
          <button class="poll-btn" type="button" data-vote-match="${escapeHtml(matchId)}" data-vote-option="empate">Empate</button>
          <button class="poll-btn" type="button" data-vote-match="${escapeHtml(matchId)}" data-vote-option="visitante">${escapeHtml(visitanteName)}</button>
        </div>
      </div>`;
  }

  async function renderJornadaPolls(next, unplayed) {
    const jornadaMatches = unplayed
      .filter(m => String(m.jornada) === String(next.jornada))
      .sort((a, b) => {
        const ia = parseInt(String(a.id_partido).replace(/\D/g, ''), 10) || 0;
        const ib = parseInt(String(b.id_partido).replace(/\D/g, ''), 10) || 0;
        return ia - ib;
      });

    if (!jornadaMatches.length) return '';

    const items = await Promise.all(jornadaMatches.map(async (m, index) => `
      <div class="poll-match-item ${index === 0 ? 'open' : ''}" data-poll-item="${escapeHtml(m.id_partido)}">
        <button class="poll-match-toggle" type="button" data-poll-toggle="${escapeHtml(m.id_partido)}" aria-expanded="${index === 0 ? 'true' : 'false'}">
          <span class="poll-match-teams">${escapeHtml(m.equipo_local)} <strong>vs</strong> ${escapeHtml(m.equipo_visitante)}</span>
          <span class="poll-match-arrow">${index === 0 ? '▲' : '▼'}</span>
        </button>
        <div class="poll-match-content">${await renderPoll(m.id_partido, m.equipo_local, m.equipo_visitante)}</div>
      </div>`));

    return `
      <div class="jornada-polls" id="jornadaPolls">
        <div class="jornada-polls-head">
          <p class="jornada-polls-title">📊 Encuestas · Jornada ${escapeHtml(next.jornada)}</p>
          <button class="jornada-polls-toggle" type="button" id="toggleJornadaPolls" aria-expanded="true">Minimizar</button>
        </div>
        <div class="jornada-polls-list" id="jornadaPollsList">
          ${items.join('')}
        </div>
      </div>`;
  }

  function bindJornadaPolls() {
    const root = document.getElementById('jornadaPolls');
    if (!root) return;

    const list = document.getElementById('jornadaPollsList');
    const toggleAll = document.getElementById('toggleJornadaPolls');

    root.querySelectorAll('[data-vote-match]').forEach(btn => {
      btn.addEventListener('click', () => {
        submitVote(btn.dataset.voteMatch, btn.dataset.voteOption);
      });
    });

    root.querySelectorAll('[data-poll-toggle]').forEach(btn => {
      btn.addEventListener('click', () => {
        const item = root.querySelector(`[data-poll-item="${CSS.escape(btn.dataset.pollToggle)}"]`);
        if (!item) return;
        const willOpen = !item.classList.contains('open');
        root.querySelectorAll('.poll-match-item').forEach(other => {
          other.classList.remove('open');
          const otherBtn = other.querySelector('[data-poll-toggle]');
          if (otherBtn) {
            otherBtn.setAttribute('aria-expanded', 'false');
            const arrow = otherBtn.querySelector('.poll-match-arrow');
            if (arrow) arrow.textContent = '▼';
          }
        });
        if (willOpen) {
          item.classList.add('open');
          btn.setAttribute('aria-expanded', 'true');
          const arrow = btn.querySelector('.poll-match-arrow');
          if (arrow) arrow.textContent = '▲';
        }
      });
    });

    if (toggleAll && list) {
      // Control global de las encuestas. Usamos el estado y el display
      // directamente para que funcione incluso si el navegador tiene
      // alguna particularidad con la clase CSS.
      toggleAll.dataset.minimized = 'false';
      toggleAll.addEventListener('click', (event) => {
        event.preventDefault();
        event.stopPropagation();

        const isMinimized = toggleAll.dataset.minimized === 'true';
        toggleAll.dataset.minimized = String(!isMinimized);
        list.classList.toggle('is-minimized', !isMinimized);
        list.style.display = !isMinimized ? 'none' : 'flex';
        toggleAll.textContent = !isMinimized ? 'Maximizar' : 'Minimizar';
        toggleAll.setAttribute('aria-expanded', String(isMinimized));
      });
    }
  }

  // --- TARJETA PRÓXIMO PARTIDO + ENCUESTAS DE LA MISMA JORNADA ---
  async function renderNextMatch() {
    const nextMatchEl = document.getElementById('nextMatch');
    if (!nextMatchEl) return;

    const unplayed = (lastPartidos || []).filter(m => !m.jugado);

    if (!unplayed.length) {
      nextMatchEl.hidden = true;
      if (nextMatchCountdownTimer) clearInterval(nextMatchCountdownTimer);
      return;
    }

    unplayed.sort((a, b) => {
      if (!a.fecha && b.fecha) return 1;
      if (a.fecha && !b.fecha) return -1;
      if (!a.fecha && !b.fecha) return 0;
      const dateA = new Date(a.fecha).getTime();
      const dateB = new Date(b.fecha).getTime();
      if (dateA !== dateB) return dateA - dateB;
      const idA = parseInt(String(a.id_partido).replace(/\D/g, ''), 10) || 0;
      const idB = parseInt(String(b.id_partido).replace(/\D/g, ''), 10) || 0;
      return idA - idB;
    });

    const next = unplayed[0];
    nextMatchEl.hidden = false;
    const info = matchScheduleInfo(next);
    const dateLabel = formatMatchDate(info);

    nextMatchEl.innerHTML = `
      <p class="next-match-label">Próximo partido</p>
      <div class="nm-teams">
        <div class="nm-team">${crestHtml(next.equipo_local)}<span>${escapeHtml(next.equipo_local)}</span></div>
        <span class="nm-vs">vs</span>
        <div class="nm-team">${crestHtml(next.equipo_visitante)}<span>${escapeHtml(next.equipo_visitante)}</span></div>
      </div>
      <p class="next-match-time">${escapeHtml(info.displayHora)}</p>
      <p class="next-match-countdown" id="nextMatchCountdown">${info.date ? formatCountdown(info.date.getTime() - Date.now()) : 'Cuenta regresiva disponible cuando haya fecha y hora'}</p>
      <p class="next-match-meta">${dateLabel ? escapeHtml(dateLabel) + ' · ' : ''}Jornada ${escapeHtml(next.jornada)} · ${next.vuelta === 'Primera' ? '1ª vuelta' : '2ª vuelta'}</p>
      ${await renderJornadaPolls(next, unplayed)}`;

    bindJornadaPolls();
    startNextMatchCountdown(next);
  }

  function renderPosiciones(rows) {
    if (!rows.length) {
      panelPos.innerHTML = stateHtml('Todavía no hay equipos', 'En cuanto se confirme la primera acta, aparece la tabla aquí.', false);
      return;
    }
    const sorted = [...rows].sort((a, b) =>
      (b.puntos - a.puntos) || (b.dg - a.dg) || (b.gf - a.gf)
    ).map((r, i) => ({ ...r, _pos: i + 1 }));
    const q = posQuery.trim().toLowerCase();
    const filtered = q ? sorted.filter(r => r.equipo.toLowerCase().includes(q)) : sorted;
    const body = filtered.length ? filtered.map((r, i) => {
      const rank = r._pos;
      const rowClass = rank === 1 ? 'leader' : rank === 2 ? 'qualify' : (rank >= 3 && rank <= 6) ? 'playoff' : '';
      return `
      <tr class="${rowClass}" style="animation-delay:${i * 35}ms">
        <td class="pos">${rank}</td>
        <td class="team">
          <button class="team-link" data-team="${escapeHtml(r.equipo)}">
            ${crestHtml(r.equipo)}
            <span class="name-stack">
              <span class="name-text">${escapeHtml(r.equipo)}</span>
              ${rachaHtml(r.equipo)}
            </span>
          </button>
        </td>
        <td class="num"><span class="countup" data-count="${r.pj}">0</span></td>
        <td class="num"><span class="countup" data-count="${r.dg}" data-prefix="+">0</span></td>
        <td class="num pts"><span class="countup" data-count="${r.puntos}">0</span></td>
      </tr>`;
    }).join('') : `<tr><td colspan="5" class="empty-row">Sin resultados para "${escapeHtml(posQuery)}"</td></tr>`;
    panelPos.innerHTML = `
      <div class="search-wrap">
        <input type="search" class="search-box" id="posSearch" placeholder="Buscar equipo…" value="${escapeHtml(posQuery)}">
        <button class="share-btn" id="shareTableBtn" type="button">Compartir</button>
      </div>
      <table>
        <thead><tr>
          <th></th><th>Equipo</th><th class="num">PJ</th><th class="num">DG</th><th class="num">Pts</th>
        </tr></thead>
        <tbody>${body}</tbody>
      </table>`;
    animateCountUp(panelPos);
    panelPos.querySelectorAll('.team-link').forEach(btn => {
      btn.addEventListener('click', () => openTeamModal(btn.dataset.team));
    });
    const input = document.getElementById('posSearch');
    input.addEventListener('input', e => {
      posQuery = e.target.value;
      renderPosiciones(lastPosiciones);
      const el = document.getElementById('posSearch');
      el.focus();
      el.setSelectionRange(el.value.length, el.value.length);
    });
    const shareBtn = document.getElementById('shareTableBtn');
    if (shareBtn) shareBtn.addEventListener('click', () => shareTable(shareBtn));
  }

function renderMvpCard(mvpData) {
  // mvpData = { nombre: 'Carlos Zelaya', equipo: 'Milan F.C', goles: 3, fotoUrl: '...' }
  if (!mvpData) return '';

  return `
    <div class="mvp-card">
      <div class="mvp-badge">⭐ JUGADOR DE LA JORNADA${mvpData.jornada ? ` · JORNADA ${escapeHtml(mvpData.jornada)}` : ''}</div>
      <div class="mvp-content">
        <div class="mvp-avatar" aria-hidden="true" title="Jugador de la jornada">
          <span class="mvp-star">⭐</span>
        </div>
        <div class="mvp-info">
          <h4 class="mvp-name">${escapeHtml(mvpData.nombre)}</h4>
          <p class="mvp-team">${crestHtml(mvpData.equipo)} ${escapeHtml(mvpData.equipo)}</p>
          ${mvpData.goles != null && mvpData.goles !== '' ? `<span class="mvp-stat">🔥 ${escapeHtml(mvpData.goles)} Goles anotados</span>` : ''}
        </div>
      </div>
    </div>
  `;
}

function renderMvpPorJornada() {
  const el = document.getElementById('mvpHero');
  if (!el) return;

  const jugadas = (lastPartidos || []).filter(m => m.jugado);
  const jornadasJugadas = [...new Set(jugadas.map(m => Number(m.jornada)).filter(Number.isFinite))].sort((a,b) => b-a);
  const jornadaActual = jornadasJugadas.length ? jornadasJugadas[0] : null;

  // El MVP se selecciona manualmente desde Supabase.
  const row = jornadaActual != null
    ? lastMvpRows.find(r => Number(r.jornada) === jornadaActual)
    : null;

  if (!row || !row.jugador) {
    el.hidden = true;
    el.innerHTML = '';
    return;
  }

  el.hidden = false;
  el.innerHTML = renderMvpCard({
    nombre: row.jugador,
    equipo: row.equipo || '',
    goles: row.goles,
    fotoUrl: row.foto_url || '',
    jornada: row.jornada
  });
}

function renderGoleadores(rows) {
    if (!rows.length) {
      panelGol.innerHTML = stateHtml('Todavía no hay goles registrados', 'Aparecerán aquí en cuanto se carguen las actas.', false);
      return;
    }
    const sorted = [...rows].filter(r => r.goles > 0).sort((a, b) => {
      if (b.goles !== a.goles) return b.goles - a.goles;
      const rankA = TEAM_RANK[a.equipo] ?? Infinity;
      const rankB = TEAM_RANK[b.equipo] ?? Infinity;
      return rankA - rankB;
    }).map((r, i) => ({ ...r, _pos: i + 1 }));

    const q = golQuery.trim().toLowerCase();
    const filtered = q
      ? sorted.filter(r => r.jugador.toLowerCase().includes(q) || r.equipo.toLowerCase().includes(q))
      : sorted;

    const limit = (q || goleadoresExpanded) ? filtered.length : Math.min(15, filtered.length);
    const shown = filtered.slice(0, limit);
    const body = shown.length ? shown.map((r, i) => `
      <tr class="${r._pos === 1 ? 'leader' : ''}" style="animation-delay:${i * 35}ms">
        <td class="pos">${r._pos}</td>
        <td class="player"><div class="name-cell">${crestHtml(r.equipo)}<span>${escapeHtml(r.jugador)}<button class="player-team-link" data-team="${escapeHtml(r.equipo)}">${escapeHtml(r.equipo)}</button></span></div></td>
        <td class="num pts"><span class="countup" data-count="${r.goles}">0</span></td>
      </tr>`).join('') : `<tr><td colspan="3" class="empty-row">Sin resultados para "${escapeHtml(golQuery)}"</td></tr>`;
    
    const moreBtn = (!q && filtered.length > 15)
      ? `<button class="more" id="toggleMore">${goleadoresExpanded ? 'Ver menos' : `Ver los ${filtered.length}`}</button>`
      : '';

    panelGol.innerHTML = `
      <div class="search-wrap"><input type="search" class="search-box" id="golSearch" placeholder="Buscar jugador o equipo…" value="${escapeHtml(golQuery)}"></div>
      <table>
        <thead><tr><th></th><th>Jugador</th><th class="num">Goles</th></tr></thead>
        <tbody>${body}</tbody>
      </table>${moreBtn}`;

    animateCountUp(panelGol);

    panelGol.querySelectorAll('.player-team-link').forEach(btn => {
      btn.addEventListener('click', () => openTeamModal(btn.dataset.team));
    });

    const toggle = document.getElementById('toggleMore');
    if (toggle) toggle.addEventListener('click', () => {
      goleadoresExpanded = !goleadoresExpanded;
      renderGoleadores(rows);
    });

    const input = document.getElementById('golSearch');
    input.addEventListener('input', e => {
      golQuery = e.target.value;
      renderGoleadores(lastGoleadores);
      const el = document.getElementById('golSearch');
      el.focus();
      el.setSelectionRange(el.value.length, el.value.length);
    });
  }

// 1. Variable global para el filtro
window.selectedEquipo = 'todos';

// 2. Función global para responder al cambio de opción en el selector
window.filterCalendarioByTeam = function(teamName) {
  window.selectedEquipo = teamName;
  if (window.lastCalendarioData) {
    renderCalendario(window.lastCalendarioData);
  }
};

// 3. Función principal del Calendario
function renderCalendario(rows) {
  window.lastCalendarioData = rows;

  if (!rows || !rows.length) {
    panelCal.innerHTML = stateHtml('Todavía no hay calendario', 'Los partidos aparecen aquí en cuanto se carguen.', false);
    return;
  }

  const sel = window.selectedEquipo || 'todos';

  // Obtener lista única de equipos ignorando espacios extras
  const equipos = [...new Set(rows.flatMap(r => [r.equipo_local, r.equipo_visitante]))]
    .filter(Boolean)
    .map(e => e.trim())
    .filter((v, i, a) => a.indexOf(v) === i)
    .sort();

  // Selector HTML
  let selectHtml = `
    <div class="cal-filter-container">
      <label for="cal-team-select">Filtrar por equipo:</label>
      <select id="cal-team-select" class="cal-select" onchange="window.filterCalendarioByTeam(this.value)">
        <option value="todos" ${sel === 'todos' ? 'selected' : ''}>⚽ Todos los equipos</option>
        ${equipos.map(eq => `<option value="${escapeHtml(eq)}" ${sel === eq ? 'selected' : ''}>${escapeHtml(eq)}</option>`).join('')}
      </select>
    </div>
  `;

  // Filtrar filas comparando los nombres limpios
  const filteredRows = sel === 'todos' 
    ? rows 
    : rows.filter(r => 
        (r.equipo_local && r.equipo_local.trim() === sel) || 
        (r.equipo_visitante && r.equipo_visitante.trim() === sel)
      );

  let html = selectHtml;

  if (!filteredRows.length) {
    html += stateHtml('Sin partidos', `No se encontraron encuentros para ${sel}.`, false);
    panelCal.innerHTML = `<div class="cal-list">${html}</div>`;
    return;
  }

  ['Primera', 'Segunda'].forEach(vuelta => {
    const matches = filteredRows.filter(r => r.vuelta === vuelta);
    if (!matches.length) return;
    
    // Si hay un filtro activo, la vuelta se mantiene desplegada automáticamente
    const isOpen = (vuelta === 'Segunda' || sel !== 'todos') ? 'open' : '';
    
    html += `<details class="cal-vuelta-details" ${isOpen}>`;
    html += `  <summary class="cal-vuelta">${vuelta === 'Primera' ? 'Primera vuelta' : 'Segunda vuelta'}</summary>`;
    html += `  <div class="cal-vuelta-content">`;
    
    const jornadas = [...new Set(matches.map(r => r.jornada))].sort((a, b) => a - b);
    
    jornadas.forEach(j => {
      const jornadaMatches = matches.filter(r => r.jornada === j);
      
      let dayLabel = '';
      const primerConFecha = jornadaMatches.find(m => m.fecha);
      if (primerConFecha) {
        const d = new Date(`${primerConFecha.fecha}T12:00:00-06:00`);
        if (!Number.isNaN(d.getTime())) {
           dayLabel = d.toLocaleDateString('es-HN', { weekday:'long', day:'numeric', month:'short' });
           dayLabel = dayLabel.charAt(0).toUpperCase() + dayLabel.slice(1);
        }
      }

      html += `<div class="cal-jornada"><span>Jornada ${j}</span><span class="cal-jornada-line"></span>${dayLabel ? `<span class="cal-jornada-day">${escapeHtml(dayLabel)}</span>` : ''}</div>`;
      
      jornadaMatches.forEach(m => {
        const score = m.jugado
          ? `<span class="cal-score">${m.goles_local} - ${m.goles_visitante}</span>`
          : `<span class="cal-score pending">vs</span>`;
        
        let horaHtml = '';
        if (m.hora) {
          const info = matchScheduleInfo(m);
          if (info.displayHora !== 'Hora por confirmar') {
            horaHtml = `<div class="cal-match-time">${escapeHtml(info.displayHora)}</div>`;
          }
        }

        const isLocalHighlight = sel !== 'todos' && m.equipo_local && m.equipo_local.trim() === sel ? 'highlight-team' : '';
        const isVisitHighlight = sel !== 'todos' && m.equipo_visitante && m.equipo_visitante.trim() === sel ? 'highlight-team' : '';

        html += `
          <div class="cal-match">
            ${horaHtml}
            <div class="cal-match-row">
              <div class="cal-side ${isLocalHighlight}">${crestHtml(m.equipo_local)}<span class="cal-name">${escapeHtml(m.equipo_local)}</span></div>
              ${score}
              <div class="cal-side right ${isVisitHighlight}">${crestHtml(m.equipo_visitante)}<span class="cal-name">${escapeHtml(m.equipo_visitante)}</span></div>
            </div>
          </div>`;
      });
    });
    
    html += `  </div>`;
    html += `</details>`;
  });

  panelCal.innerHTML = `<div class="cal-list">${html}</div>`;
}

// Función auxiliar para re-renderizar al cambiar la opción en el select
function filterCalendarioByTeam(teamName) {
  selectedEquipo = teamName;
  if (window.lastCalendarioData) {
    renderCalendario(window.lastCalendarioData);
  }
}

  let lastPosiciones = null, lastGoleadores = null;

  async function load(isRetry) {
    if (isRetry) {
      panelPos.innerHTML = stateHtml('Cargando…', '', false);
      panelGol.innerHTML = stateHtml('Cargando…', '', false);
      panelCal.innerHTML = stateHtml('Cargando…', '', false);
    }
    try {
      const [pos, gol, cal] = await Promise.all([fetchTable('posiciones_view'), fetchTable('goleadores_view'), fetchTable('Partidos')]);
      lastPosiciones = pos; lastGoleadores = gol;

      // MVP se administra desde Supabase. Si la tabla todavía no existe
      // o no tiene filas, simplemente no se muestra la tarjeta.
      try {
        lastMvpRows = await fetchTable('MVP_Jornadas');
      } catch (e) {
        console.warn('MVP_Jornadas todavía no está disponible:', e);
        lastMvpRows = [];
      }

      await refreshEncuestas();
      
      // Aquí forzamos la propiedad 'jugado' leyendo directamente si hay goles reportados
      lastPartidos = [...cal].map(m => ({
        ...m,
        jugado: (m.goles_local !== null && m.goles_local !== '')
      })).sort((a, b) => {
        const numA = a.orden != null ? a.orden : parseInt(String(a.id_partido).replace(/\D/g, ''), 10);
        const numB = b.orden != null ? b.orden : parseInt(String(b.id_partido).replace(/\D/g, ''), 10);
        return numA - numB;
      });

      LIVE_LOGOS = Object.fromEntries(pos.filter(r => r.logo_url).map(r => [r.equipo, r.logo_url]));
      const posRanked = [...pos].sort((a, b) => (b.puntos - a.puntos) || (b.dg - a.dg) || (b.gf - a.gf));
      TEAM_RANK = Object.fromEntries(posRanked.map((r, i) => [r.equipo, i]));
      let playoffs = [];
      try { playoffs = await fetchTable('Playoffs'); } catch (e) { }
      
      renderPosiciones(pos);
      renderGoleadores(gol);
      renderLlaves(pos, playoffs);
      renderCalendario(lastPartidos);
      await renderNextMatch();
      renderMvpPorJornada();
      
      syncDot.className = 'dot';
      syncText.textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-HN', { hour: '2-digit', minute: '2-digit' });
    } catch (err) {
      syncDot.className = 'dot err';
      syncText.textContent = 'Sin conexión con los datos';
      if (!lastPosiciones) {
        panelPos.innerHTML = stateHtml('No se pudieron cargar los datos', 'Revisa tu conexión e intenta de nuevo.', true);
      }
      if (!lastGoleadores) {
        panelGol.innerHTML = stateHtml('No se pudieron cargar los datos', 'Revisa tu conexión e intenta de nuevo.', true);
      }
      if (!lastPosiciones) {
        panelLlaves.innerHTML = stateHtml('No se pudieron cargar los datos', 'Revisa tu conexión e intenta de nuevo.', true);
        panelCal.innerHTML = stateHtml('No se pudieron cargar los datos', 'Revisa tu conexión e intenta de nuevo.', true);
      }
    }
  }

  window.__reloadTorneo = () => load(true);

  const tabsByKey = { pos: tabPos, gol: tabGol, llaves: tabLlaves, cal: tabCal };
  const panelsByKey = { pos: panelPos, gol: panelGol, llaves: panelLlaves, cal: panelCal };
  
  function selectTab(which) {
    Object.keys(tabsByKey).forEach(key => {
      const isSel = key === which;
      tabsByKey[key].setAttribute('aria-selected', String(isSel));
      panelsByKey[key].hidden = !isSel;
    });
  }
  
  tabPos.addEventListener('click', () => selectTab('pos'));
  tabGol.addEventListener('click', () => selectTab('gol'));
  tabLlaves.addEventListener('click', () => selectTab('llaves'));
  tabCal.addEventListener('click', () => selectTab('cal'));

  load(true);
  setInterval(() => load(false), REFRESH_MS);
})();
</script>
